name: Bug Report
description: File a bug report to help us fix an issue in Arya Dock
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues to avoid duplicates.
        *If you have found a security vulnerability, please report it via [SECURITY.md](https://github.com/kartik1502/arya-dock/security/policy) rather than filing a public issue.*

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Start server with `npm start`
        2. Open web app in mobile browser
        3. Trigger button '...'
        4. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred instead.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you running? (Run `node -v`)
      placeholder: e.g. v20.11.0
    validations:
      required: true

  - type: input
    id: os-distro
    attributes:
      label: Linux Distribution & Compositor
      description: What distribution and display server are you using?
      placeholder: e.g. Fedora 40 (GNOME 46 / Wayland)
    validations:
      required: true

  - type: input
    id: terminal-emulator
    attributes:
      label: Terminal Emulator
      description: Default or configured terminal emulator (if reporting terminal launch issues).
      placeholder: e.g. Ptyxis, GNOME Terminal, Kitty, Alacritty
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Server Output or Browser Logs
      description: Paste any server terminal output or browser console logs here.
      render: shell
    validations:
      required: false
